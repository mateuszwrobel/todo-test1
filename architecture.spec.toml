# architecture.spec.toml — todo application module boundaries (spec-first, ADR-001)
#
# Planned go layout, module rooted at this directory:
#   board    — kanban data module (owns card collection, fixed columns, ordering)
#   api      — HTTP translation layer over the data module's in-process contract
#   ui       — server-rendered page (htmx); reaches api over HTTP at RUNTIME only
#   cmd/todo — composition root (package main): wires store + api + ui. Chosen over
#              a root main package so the root stays clean of wiring code.
#
# (The `todos` entry retired with the package at KW4/api/10 — the last todo
# endpoint's retirement, per dependencies_kanban.md §KW4.)
#
# Matching notes (archspec help glob / help languages):
# - go `matches.units` takes globs over FULL import paths; the go module path is
#   not pinned yet (no go.mod), so each boundary claims its package with a
#   module-path-agnostic `*/pkg` glob — robust to whatever prefix go.mod declares.
# - Until the packages exist, `verify` finds no sources and reports unmet
#   expectations — that red state is the gate standing by, by design.
# - Boundaries and directions validated against a scratch tree before commit:
#   green when wired as planned, red (`forbidden edge`) on drift.

[project]
language = "go"

# Board data module (kanban pivot, ADR-003): depends on NOTHING internal. Only
# api (contract translation) and the composition root may import it; ui never
# reaches it (HTTP only) — workplan_board_store.md Boundaries. The sole data
# module now that todos retired at KW4/api/10.
[[module]]
name = "board"
matches = { units = ["*/board"] }
[module.allowed]
depend_on = []
forbidden = ["api", "ui", "server"]

# HTTP translation layer: internal dependency is board alone — the todos edge
# this also carried served the todo endpoints, retired by KW4 (api/01, api/02,
# api/05, api/10). The api→board edge was declared at the wave that first
# imported board — KW1 api/01, not before.
[[module]]
name = "api"
matches = { units = ["*/api"] }
[module.allowed]
depend_on = ["board"]
forbidden = ["ui", "server"]

# Page module: coupling to api is HTTP at runtime (invisible to the driver), so
# no in-process dependency is allowed — including none on the data modules
# (workplan boundary: ui never reaches board or the data files).
[[module]]
name = "ui"
matches = { units = ["*/ui"] }
[module.allowed]
depend_on = []
forbidden = ["board", "api", "server"]

# Composition root: cmd/todo, package main — sanctioned wiring (go driver marks it
# role `composition`), depends on all modules it composes. The server→board edge
# was declared at the wave that first imported board — KW1 api/01, whose wiring
# opened kanban.db beside todos.db; the todos edge retired at KW4/api/10.
[[module]]
name = "server"
matches = { units = ["*/cmd/todo"] }
[module.allowed]
depend_on = ["board", "api", "ui"]

# No dependency cycles among the declared modules.
[[constraint]]
type = "no_cycles"
modules = ["board", "api", "ui", "server"]
severity = "error"
