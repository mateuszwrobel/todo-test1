# architecture.spec.toml — todo application module boundaries (spec-first, ADR-001)
#
# Planned go layout, module rooted at this directory:
#   users    — the simulation's fixed cast (constant roster + membership check);
#              plain data, imports nothing, owns no state
#   board    — kanban data module (owns card collection, fixed columns, ordering)
#   api      — HTTP translation layer over the data module's in-process contract
#   ui       — server-rendered page (htmx); reaches api over HTTP at RUNTIME only
#   cmd/todo — composition root (package main): wires store + api + ui. Chosen over
#              a root main package so the root stays clean of wiring code.
#   cmd/db-diagram — schema-diagram generator (package main): dev tool, reads the
#              live schema through board and renders docs/db-schema.md.
#
# (The `todos` entry retired with the package at KW4/api/10 — the last todo
# endpoint's retirement, per dependencies_kanban.md §KW4.)
#
# Matching notes (archspec help glob / help languages):
# - go `matches.units` takes globs over FULL import paths; the go module path is
#   not pinned yet (no go.mod), so each boundary claims its package with a
#   module-path-agnostic `*/pkg` glob — robust to whatever prefix go.mod declares.
# - Until the packages exist, `verify` finds no sources and reports unmet
#   expectations — that red state is the gate standing by, by design.
# - Boundaries and directions validated against a scratch tree before commit:
#   green when wired as planned, red (`forbidden edge`) on drift.

[project]
language = "go"

# The simulation's cast (KW9): a bottom module — one constant roster and a
# membership check, no state, no I/O, no imports at all. It is imported by
# board (assignee validity), by api (GET /users, the roster endpoint), and by
# the composition root (KW9 ui/14: wiring users.Names into ui's Roster
# consumer port); ui never imports it — the names reach the page through the
# injected port only (workplan_users_roster.md Boundaries). Declared at the
# wave that lands the package; the board edge arrived with board/15, the api
# edge with api/12, the server edge with ui/14.
[[module]]
name = "users"
matches = { units = ["*/users"] }
[module.allowed]
depend_on = []
forbidden = ["board", "api", "ui", "server"]

# Board data module (kanban pivot, ADR-003): its one internal edge is users —
# the assignee direction of Change screens the name through the roster
# contract. Only api (contract translation) and the composition root may import
# it; ui never reaches it (HTTP only) — workplan_board_store.md Boundaries. The
# sole data module now that todos retired at KW4/api/10. The users edge is
# declared at KW9, the wave that first imported it.
[[module]]
name = "board"
matches = { units = ["*/board"] }
[module.allowed]
depend_on = ["users"]
forbidden = ["api", "ui", "server"]

# HTTP translation layer: its board edge — the todos edge this also carried
# served the todo endpoints, retired by KW4 (api/01, api/02, api/05, api/10).
# The api→board edge was declared at the wave that first imported board —
# KW1 api/01, not before. The api→users edge was declared at the wave that
# first imported users — KW9 api/12 (GET /users served from the roster), not
# before; it carries no state dependency, only the constant cast the endpoint
# states verbatim.
[[module]]
name = "api"
matches = { units = ["*/api"] }
[module.allowed]
depend_on = ["board", "users"]
forbidden = ["ui", "server"]

# Page module: coupling to api is HTTP at runtime (invisible to the driver), so
# no in-process dependency is allowed — including none on the data modules
# (workplan boundary: ui never reaches board or the data files) and none on
# users (KW9 boundary: the page receives roster names through the Roster
# consumer port it declares, injected by the composition root — never an
# import).
[[module]]
name = "ui"
matches = { units = ["*/ui"] }
[module.allowed]
depend_on = []
forbidden = ["board", "api", "server", "users"]

# Composition root: cmd/todo, package main — sanctioned wiring (go driver marks it
# role `composition`), depends on all modules it composes. The server→board edge
# was declared at the wave that first imported board — KW1 api/01, whose wiring
# opened kanban.db beside todos.db; the todos edge retired at KW4/api/10. The
# server→users edge was declared at the wave that first imported users — KW9
# ui/14, whose wiring injects users.Names into ui's Roster consumer port (ui
# itself stays forbidden from users: the names reach the page through the port,
# never an import).
[[module]]
name = "server"
matches = { units = ["*/cmd/todo"] }
[module.allowed]
depend_on = ["board", "api", "ui", "users"]

# Schema-diagram generator: cmd/db-diagram, package main — a dev tool, not the
# app's composition root. Its board edge: board.Open materializes the current
# schema in a temp file and the generator reads it back with PRAGMA
# introspection. The users edge was declared at the wave that first imported
# users — the roster note on the assignee column, whose names the generator
# reads from users.Names so docs/db-schema.md states who an assignee can be
# (the cast is module data, never stored, so introspection cannot show it).
# It composes no api/ui handlers and must not start reaching for them.
[[module]]
name = "db-diagram"
matches = { units = ["*/cmd/db-diagram"] }
[module.allowed]
depend_on = ["board", "users"]
forbidden = ["api", "ui", "server"]

# No dependency cycles among the declared modules.
[[constraint]]
type = "no_cycles"
modules = ["users", "board", "api", "ui", "server", "db-diagram"]
severity = "error"
